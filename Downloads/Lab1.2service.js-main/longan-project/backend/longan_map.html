<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Longan Map - สิธินนท์ 6604101388</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 550px; width: 100%; border-radius: 12px; }
        .custom-label { background: #15803d; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="container mx-auto p-6">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-extrabold text-green-800">ระบบติดตามราคาสินค้าเกษตร</h1>
            <div id="dev-tag" class="mt-4 inline-block bg-white px-6 py-2 rounded-full shadow-sm border border-green-200">
                <span class="text-gray-600 italic">กำลังโหลดข้อมูลผู้พัฒนา...</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
                <h2 class="text-xl font-bold mb-4 text-gray-800">สำรวจราคาวันนี้</h2>
                <form id="priceForm" class="space-y-4">
                    <input type="text" id="place" placeholder="ชื่อตลาด/สถานที่" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none" required>
                    <input type="text" id="province" placeholder="จังหวัด" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none" required>
                    <input type="number" id="price" placeholder="ราคา (บาท/กก.)" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-green-500 outline-none" required>
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">ปักหมุดข้อมูล</button>
                </form>
            </div>
            <div class="lg:col-span-2">
                <div id="map" class="shadow-xl border-4 border-white"></div>
            </div>
        </div>
    </div>

    <script>
        let studentInfo = "สิธินนท์ | 6604101388";

        // 1. ดึงข้อมูลจาก Backend
        async function loadData() {
            try {
                const [userRes, demoRes] = await Promise.all([
                    fetch('/api/user'),
                    fetch('/api/demo')
                ]);
                const userData = await userRes.json();
                const demoData = await demoRes.json();

                studentInfo = `${userData.name} | ${userData.id}`;
                document.getElementById('dev-tag').innerHTML = `
                    <p class="text-green-700 font-bold text-lg">${studentInfo}</p>
                    <p class="text-xs text-blue-500 uppercase tracking-widest">${demoData.docker.title}</p>
                `;
            } catch (e) {
                document.getElementById('dev-tag').innerText = "เชื่อมต่อ Server ไม่ได้";
            }
        }

        // 2. ตั้งค่าแผนที่
        const map = L.map('map').setView([18.7883, 98.9853], 8);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        async function addPoint(place, province, price) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${place},${province}`);
            const data = await res.json();
            if (data[0]) {
                const marker = L.marker([data[0].lat, data[0].lon]).addTo(map);
                marker.bindTooltip(studentInfo, { permanent: true, direction: 'top', className: 'custom-label' }).openTooltip();
                marker.bindPopup(`<b>${place}</b><br>ราคา: ${price} บาท`).openPopup();
                map.setView([data[0].lat, data[0].lon], 10);
            }
        }

        document.getElementById('priceForm').addEventListener('submit', (e) => {
            e.preventDefault();
            addPoint(document.getElementById('place').value, document.getElementById('province').value, document.getElementById('price').value);
        });

        window.onload = loadData;
    </script>
</body>
</html>
